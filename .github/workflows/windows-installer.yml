name: Build Windows installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft Windows release tag
        required: true
        default: windows-v1.1.0
      payload_sha256:
        description: SHA-256 of the universal portable ZIP
        required: true
permissions:
  contents: write
concurrency:
  group: windows-installer
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      PAYLOAD_SHA256: ${{ inputs.payload_sha256 }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate and unpack release payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^windows-v(\d+\.\d+\.\d+)$') { throw 'Unexpected release tag' }
          "APP_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Append
          $assetVersion = $env:RELEASE_TAG.Substring('windows-v'.Length)
          if ($env:PAYLOAD_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'Invalid payload hash' }
          $release = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft) { throw 'A draft release is required' }
          gh release download $env:RELEASE_TAG --pattern "BecomeMyScreen-Windows-Portable-$assetVersion.zip" --dir payload-download
          if ($LASTEXITCODE -ne 0) { throw 'Payload download failed' }
          $archive = Get-Item payload-download/*.zip
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PAYLOAD_SHA256) { throw 'Payload hash mismatch' }
          Expand-Archive $archive.FullName -DestinationPath payload
          if (Get-ChildItem payload -Recurse -Filter ffmpeg.exe) { throw 'Encoder must be obtained directly from its publisher on first launch' }
      - name: Validate native x64 app
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'native-self-test.txt'
          $app = Resolve-Path 'payload/win-x64/BecomeMyScreen.exe'
          $p = Start-Process $app -ArgumentList @('--self-test', "`"$result`"") -PassThru -Wait
          if ($p.ExitCode -ne 0 -or !(Test-Path $result)) { throw 'Native self-test failed' }
          $text = Get-Content $result -Raw
          Write-Host $text
          if (!$text.StartsWith('PASS ') -or !$text.Contains('Architecture: X64')) { throw 'Native self-test did not pass' }
      - name: Validate software-device callback on native x64 Windows
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'software-device-self-test.txt'
          $app = Resolve-Path 'payload/win-x64/BecomeMyScreen.exe'
          $p = Start-Process $app -ArgumentList @('--software-device-self-test', "`"$result`"") -PassThru -Wait
          if ($p.ExitCode -ne 0 -or !(Test-Path $result)) { throw 'Software-device self-test failed' }
          $text = Get-Content $result -Raw
          Write-Host $text
          if (!$text.StartsWith('PASS ') -or !$text.Contains('Architecture: X64')) { throw 'Software-device callback did not pass' }
      - name: Validate display topology API without applying changes
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'display-topology-self-test.txt'
          $p = Start-Process (Resolve-Path payload/win-x64/BecomeMyScreen.exe) -ArgumentList @('--display-topology-self-test', "`"$result`"") -PassThru -Wait
          if (!(Test-Path $result)) { throw 'Display topology test did not finish' }
          $text = Get-Content $result -Raw
          Write-Host $text
          if ($p.ExitCode -ne 0 -or !$text.StartsWith('PASS ')) { throw 'Display topology API check failed' }
      - name: Exercise the shipped settings dialog in five languages
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'settings-result.txt'
          $p = Start-Process (Resolve-Path payload/win-x64/BecomeMyScreen.exe) -ArgumentList @('--settings-self-test', "`"$result`"") -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $result) -or !(Select-String $result -Pattern '^PASS ')) { Get-Content $result; throw 'Settings check failed' }
      - name: Install pinned compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Compiler hash mismatch' }
          if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw 'Compiler signature invalid' }
          $p = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$env:RUNNER_TEMP\InnoSetup") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Compiler installation failed: $($p.ExitCode)" }
      - name: Build unsigned universal installer
        shell: pwsh
        run: |
          ./windows-build/scripts/build-installer.ps1 -Version $env:APP_VERSION -PayloadRoot (Resolve-Path payload).Path -Compiler "$env:RUNNER_TEMP/InnoSetup/ISCC.exe" -DownloadEncoderOnFirstRun
      - name: Install, upgrade in place, and uninstall on Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function RunSetup([string]$exePath,[string[]]$flags,[string]$log,[int]$seconds=240) {
            Write-Host "Starting $exePath"
            $p=Start-Process $exePath -ArgumentList ($flags + "/LOG=`"$log`"") -PassThru
            $until=[DateTime]::UtcNow.AddSeconds($seconds)
            while (!$p.WaitForExit(10000)) {
              if (Test-Path $log) { Get-Content $log -Tail 3 }
              if ([DateTime]::UtcNow -gt $until) {
                Get-Process | Where-Object { $_.Name -match 'pnputil|setup|unins|BecomeMyScreen' } | Select-Object Id,Name,MainWindowTitle
                if (Test-Path $log) { Get-Content $log -Tail 55 }
                throw "Setup timeout: $exePath"
              }
            }
            if ($p.ExitCode -ne 0) { if(Test-Path $log){Get-Content $log -Tail 55}; throw "Setup failed: $($p.ExitCode)" }
          }
          $exe = Get-Item "windows-build/artifacts/installer/BecomeMyScreen-Windows-Setup-$env:APP_VERSION.exe"
          $dest = "$env:ProgramFiles/BecomeMyScreen-QA"
          $flags = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=`"$dest`"")
          # This ephemeral, internal QA runner has no user to answer Windows' publisher
          # prompt. Trust only the verified upstream signer for this job, never on an
          # end user's PC. The shipped installer does not change certificate stores.
          $cat = Get-AuthenticodeSignature (Resolve-Path 'payload/win-x64/driver/mttvdd.cat')
          if ($cat.Status -ne 'Valid' -or $cat.SignerCertificate.Subject -notmatch 'SignPath Foundation') { throw 'Unexpected driver publisher' }
          $testStore = [Security.Cryptography.X509Certificates.X509Store]::new('TrustedPublisher','LocalMachine')
          $testStore.Open('ReadWrite')
          $already = $testStore.Certificates.Find('FindByThumbprint',$cat.SignerCertificate.Thumbprint,$false).Count
          if (!$already) { $testStore.Add($cat.SignerCertificate) }
          try {
          foreach ($action in @('install','update')) {
            if ($action -eq 'update') {
              # Start two real ADB servers, both called adb.exe. Only the one
              # loaded from the installed tools folder should be stopped.
              $ownedAdb = "$dest/tools/adb.exe"
              $otherDir = "$env:RUNNER_TEMP/other-android-sdk"
              New-Item $otherDir -ItemType Directory -Force | Out-Null
              Copy-Item "$dest/tools/adb.exe","$dest/tools/AdbWinApi.dll","$dest/tools/AdbWinUsbApi.dll" $otherDir
              $otherAdb = "$otherDir/adb.exe"
              & $ownedAdb -P 5067 start-server
              if ($LASTEXITCODE -ne 0) {throw 'Bundled ADB startup failed'}
              & $otherAdb -P 5068 start-server
              if ($LASTEXITCODE -ne 0) {throw 'Independent SDK startup failed'}
              $owned = @(Get-Process adb | Where-Object { $_.Path -eq [IO.Path]::GetFullPath($ownedAdb) })
              $other = @(Get-Process adb | Where-Object { $_.Path -eq [IO.Path]::GetFullPath($otherAdb) })
              if ($owned.Count -ne 1 -or $other.Count -ne 1) { throw 'Both ADB servers must be running before the update' }
              $hostApp = Start-Process "$dest/BecomeMyScreen.exe" -ArgumentList '--background' -PassThru
              Start-Sleep 2
              if ($hostApp.HasExited) { throw 'Host must be running before the update' }
              $flags += '/UPDATE'
            }
            RunSetup $exe.FullName $flags "$env:RUNNER_TEMP/$action.log"
            if ($action -eq 'update') {
              if (!$hostApp.HasExited -or !$owned[0].HasExited -or $other[0].HasExited) { throw 'Host or owned ADB survived update, or independent SDK was killed' }
              Write-Host 'PASS running host and bundled ADB stopped; independent SDK ADB retained its PID'
              & $otherAdb -P 5068 kill-server
            }
            try {
              if (!(Test-Path "$dest/BecomeMyScreen.exe")) { throw "Installed EXE missing: $dest" }
              $service = Get-Service BecomeMyScreenDisplay
              $service.WaitForStatus('Running',[TimeSpan]::FromSeconds(30))
              Write-Host "$action OK: installed executable present, display service running"
            } catch {
              Get-Content "$env:RUNNER_TEMP/$action.log" -Tail 85
              Get-CimInstance Win32_Service -Filter "Name='BecomeMyScreenDisplay'" | Select-Object State,ExitCode,ServiceSpecificExitCode,PathName
              throw
            }
          }
          RunSetup "$dest/unins000.exe" @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') "$env:RUNNER_TEMP/uninstall.log"
          # Inno may delegate cleanup to a temporary uninstaller process.
          for ($i=0;$i -lt 45 -and (Get-Service BecomeMyScreenDisplay -ErrorAction SilentlyContinue);$i++) { Start-Sleep 1 }
          if (Get-Service BecomeMyScreenDisplay -ErrorAction SilentlyContinue) { throw 'Service uninstall failed' }
          } finally {
            if (!$already) { $testStore.Remove($cat.SignerCertificate) }
            $testStore.Close()
          }
      - name: Attach verified installer to draft
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item "windows-build/artifacts/installer/BecomeMyScreen-Windows-Setup-$env:APP_VERSION.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content windows-build/artifacts/installer/SHA256SUMS-Setup.txt -Encoding ascii
          gh release upload $env:RELEASE_TAG $exe.FullName ($exe.FullName + '.json') windows-build/artifacts/installer/SHA256SUMS-Setup.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Installer upload failed' }
          Write-Host "Installer SHA256: $hash"
